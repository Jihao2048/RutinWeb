    <h1>嘉立创EDA导出3D文件怎么改板厚</h1>
    <img src="resource/屏幕截图1JLCEDA.png" style="width: 100%;">
    <p>打开编辑器</p>
    <img src="resource/屏幕截图2JLCEDA.png" style="width: 100%;">
    <p>点击右上角板层管理器</p>
    <img src="resource/屏幕截图3JLCEDA.png" style="width: 100%;">
    <p>点击第二页</p>
    <img src="resource/屏幕截图4JLCEDA.png" style="width: 100%;">
    <p>输入厚度</p>
    <img src="resource/屏幕截图5JLCEDA.png" style="width: 100%;">
    <p>点击自动分配基板厚度</p>
    <img src="resource/屏幕截图6JLCEDA.png" style="width: 100%;">
    <p>好了，你再导出就能看到效果了</p>
